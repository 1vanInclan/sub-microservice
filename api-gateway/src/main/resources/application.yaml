spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: user-service-route
            uri: lb://user-service
            predicates:
            - path=/api/v1/users/**
          - id: subscription-service-route
            uri: lb://subscription-service
            predicates:
            - path=/api/v1/subscriptions/**
server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
