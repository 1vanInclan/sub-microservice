version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-user-service
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - subscription-net

  mongo-db:
    image: mongo:7.0
    container_name: mongo-subscription-service
    environment:
      MONGO_INITDB_DATABASE: subscription_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - subscription-net

  redis-cache:
    image: redis:7.2-alpine
    container_name: redis-notification-service
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - subscription-net

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  subscription-net:
    driver: bridge