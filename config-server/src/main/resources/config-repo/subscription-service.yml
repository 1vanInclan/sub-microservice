server:
  port: 8082

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/subscription_db?uuidRepresentation=standard

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.proyecto.subscription_service: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG
